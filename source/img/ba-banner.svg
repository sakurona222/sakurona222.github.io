<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a2e"/>
      <stop offset="45%" stop-color="#003153"/>
      <stop offset="100%" stop-color="#0a84c9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#77deff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#77deff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#77deff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#77deff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#77deff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

  <!-- 光晕 -->
  <circle cx="1240" cy="260" r="360" fill="url(#halo)"/>
  <circle cx="1240" cy="260" r="210" fill="none" stroke="#77deff" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="1240" cy="260" r="150" fill="none" stroke="#77deff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 斜切几何装饰 -->
  <g fill="#77deff" fill-opacity="0.10">
    <path d="M0 800 L360 800 L120 420 L0 620 Z"/>
    <path d="M240 0 L520 0 L340 260 L60 260 Z"/>
  </g>
  <g fill="#77deff" fill-opacity="0.22">
    <rect x="820" y="120" width="90" height="14" transform="skewX(-20)"/>
    <rect x="940" y="160" width="50" height="10" transform="skewX(-20)"/>
  </g>

  <!-- 黄色强调块 -->
  <rect x="820" y="210" width="120" height="8" fill="#ffe433" fill-opacity="0.85" transform="skewX(-20)"/>

  <!-- 底部霓虹线 -->
  <rect x="0" y="780" width="1600" height="4" fill="url(#glow)"/>
</svg>
